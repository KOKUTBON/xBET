worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # Upstreams for modern microservices
    upstream odds_engine {
        server odds-engine:4000;
    }

    upstream betting_engine {
        server betting-engine:4001;
    }

    upstream casino_engine {
        server casino-engine:4002;
    }

    upstream legacy_bridge {
        server legacy-bridge:4003;
    }

    upstream web_frontend {
        server web-frontend:4004;
    }

    server {
        listen 80;
        server_name localhost xbet.local;

        # 1. Real-Time WebSocket Streaming
        location /ws {
            proxy_pass http://odds_engine/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /api/v1/auth/ { limit_req zone=auth_limit burst=10 nodelay; limit_req_status 429; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_pass http://betting_engine; }
        location /api/v1/account/ { proxy_pass http://betting_engine; }
        location /api/v1/trader/ { proxy_pass http://betting_engine; }
        location /api/v1/admin/points/ { proxy_pass http://betting_engine; }
        location /api/v1/canonical/ { proxy_pass http://odds_engine; }
        location /api/v1/sports { proxy_pass http://odds_engine; }

        # 2. Sportsbook & Odds Engine API
        location /api/v1/odds/ {
            proxy_pass http://odds_engine/api/v1/odds/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/fixtures/ {
            proxy_pass http://odds_engine/api/v1/fixtures/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Betting, Wallet & Settlement Engine API
        location /api/v1/bets/ {
            proxy_pass http://betting_engine/api/v1/bets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/wallet/ {
            proxy_pass http://betting_engine/api/v1/wallet/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/settlement/ {
            proxy_pass http://betting_engine/api/v1/settlement/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Casino RGS & Virtual Sports Engine API
        location /api/v1/casino/ {
            proxy_pass http://casino_engine/api/v1/casino/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/virtual-sports/ {
            proxy_pass http://casino_engine/api/v1/virtual-sports/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 5. Legacy Bridge & Backoffice API (Users, Payments, Admin, CMS, Notifications)
        location /api/v1/users/ {
            proxy_pass http://legacy_bridge/api/v1/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/payments/ {
            proxy_pass http://legacy_bridge/api/v1/payments/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/admin/ {
            proxy_pass http://legacy_bridge/api/v1/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/notifications/ {
            proxy_pass http://legacy_bridge/api/v1/notifications/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/cms/ {
            proxy_pass http://legacy_bridge/api/v1/cms/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/support/ {
            proxy_pass http://legacy_bridge/api/v1/support/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 6. Web Frontend Application (PWA Single Page App)
        location / {
            proxy_pass http://web_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
