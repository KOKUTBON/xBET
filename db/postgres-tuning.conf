# PostgreSQL 16 Performance Tuning for High-Concurrency iGaming Sportsbook & Ledger
# Tailored for 16 Core, 64 GB RAM Enterprise Dedicated Instances

# Connectivity & Memory
max_connections = 300
shared_buffers = 16GB
effective_cache_size = 48GB
maintenance_work_mem = 2GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
wal_buffers = 64MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 64MB
huge_pages = try
min_wal_size = 2GB
max_wal_size = 16GB

# Worker Processes
max_worker_processes = 16
max_parallel_workers_per_gather = 4
max_parallel_workers = 16
max_parallel_maintenance_workers = 4

# Write-Ahead Log (WAL) & Double-Entry Integrity
wal_level = replica
synchronous_commit = on
wal_compression = zstd
archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/wal_archive/%f'

# Lock Contention Tuning
deadlock_timeout = 50ms
statement_timeout = 30000
idle_in_transaction_session_timeout = 10000
