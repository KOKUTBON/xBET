# Production Helm Values for xBET Modern Platform
global:
  environment: production
  domain: xbet.local
  tlsSecretName: xbet-tls-cert

# Common Image Registry
image:
  registry: registry.xbet.local
  pullPolicy: IfNotPresent
  tag: "1.0.0"

# 1. Odds Engine Service (Real-Time WebSockets & Ingestion)
oddsEngine:
  replicas: 3
  port: 4000
  image:
    repository: xbet/odds-engine
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# 2. Betting Engine Service (Ledger, Bets, Settlement)
# NOTE (Phase 0 Integrity): Replicas is pinned to 1 and HPA autoscaling is disabled
# to ensure ledger write single-threading and prevent split-brain in-memory state until
# distributed PostgreSQL advisory locking (pg_try_advisory_lock) and transactional outbox
# are fully operational across horizontally scaled pods in Phase 2.
bettingEngine:
  replicas: 1
  port: 4001
  image:
    repository: xbet/betting-engine
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75

# 3. Casino Engine Service (RGS, Provably Fair, Poker)
casinoEngine:
  replicas: 2
  port: 4002
  image:
    repository: xbet/casino-engine
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75

# 4. Legacy Bridge & Backoffice Service
legacyBridge:
  replicas: 2
  port: 4003
  image:
    repository: xbet/legacy-bridge
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80

# 5. Web Frontend SPA / PWA
webFrontend:
  replicas: 3
  port: 3000
  image:
    repository: xbet/web-frontend
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

# 6. Database & In-Memory Cache
postgres:
  host: postgres-postgresql.xbet.svc.cluster.local
  port: 5432
  database: xbet_platform
  user: postgres

redis:
  host: redis-master.xbet.svc.cluster.local
  port: 6379

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/websocket-services: odds-engine-svc
  hosts:
    - host: xbet.local
      paths:
        - path: /ws
          pathType: Prefix
          service: odds-engine-svc
          port: 4000
        - path: /api/v1/odds
          pathType: Prefix
          service: odds-engine-svc
          port: 4000
        - path: /api/v1/betting
          pathType: Prefix
          service: betting-engine-svc
          port: 4001
        - path: /api/v1/wallet
          pathType: Prefix
          service: betting-engine-svc
          port: 4001
        - path: /api/v1/settlement
          pathType: Prefix
          service: betting-engine-svc
          port: 4001
        - path: /api/v1/casino
          pathType: Prefix
          service: casino-engine-svc
          port: 4002
        - path: /api/v1/auth
          pathType: Prefix
          service: legacy-bridge-svc
          port: 4003
        - path: /api/v1/payments
          pathType: Prefix
          service: legacy-bridge-svc
          port: 4003
        - path: /
          pathType: Prefix
          service: web-frontend-svc
          port: 3000

# 7. Secrets & External Credentials (injected via Helm values, SealedSecrets, or Vault)
secrets:
  databaseUrl: ""
  redisUrl: ""
  jwtSecret: ""
  stripeSecretKey: ""
  stripeWebhookSecret: ""
  paypalClientId: ""
  paypalClientSecret: ""
  coinpaymentsPublicKey: ""
  enetpulseApiKey: ""
  oddserviceApiKey: ""
