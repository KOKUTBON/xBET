apiVersion: v1
kind: ConfigMap
metadata:
  name: xbet-platform-config
  labels:
    app.kubernetes.io/name: xbet-platform
data:
  NODE_ENV: {{ .Values.global.environment | default "production" | quote }}
  LOG_LEVEL: {{ .Values.global.logLevel | default "info" | quote }}
  ODDS_ENGINE_PORT: "4000"
  BETTING_ENGINE_PORT: "4001"
  CASINO_ENGINE_PORT: "4002"
  LEGACY_BRIDGE_PORT: "4003"
  WEB_FRONTEND_PORT: "4004"
  ODDS_ENGINE_URL: "http://odds-engine-svc:4000"
  BETTING_ENGINE_URL: "http://betting-engine:4001"
  CASINO_ENGINE_URL: "http://casino-engine:4002"
  LEGACY_BRIDGE_URL: "http://legacy-bridge:4003"
  WEB_FRONTEND_URL: "http://web-frontend:4004"
