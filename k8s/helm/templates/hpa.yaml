# ==============================================================================
# Horizontal Pod Autoscalers (HPA) for High-Volume Services
# ==============================================================================
{{- if .Values.oddsEngine.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: odds-engine-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: odds-engine
  minReplicas: {{ .Values.oddsEngine.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.oddsEngine.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.oddsEngine.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
