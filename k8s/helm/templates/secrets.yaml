apiVersion: v1
kind: Secret
metadata:
  name: xbet-platform-secrets
  labels:
    app.kubernetes.io/name: xbet-platform
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default "postgresql://postgres:REPLACE_WITH_SECURE_PASSWORD@postgres-service:5432/xbet_production?schema=public" | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | default "redis://redis-service:6379/0" | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "REPLACE_WITH_SECURE_JWT_SECRET" | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | default "" | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | default "" | quote }}
  PAYPAL_CLIENT_ID: {{ .Values.secrets.paypalClientId | default "" | quote }}
  PAYPAL_CLIENT_SECRET: {{ .Values.secrets.paypalClientSecret | default "" | quote }}
  COINPAYMENTS_PUBLIC_KEY: {{ .Values.secrets.coinpaymentsPublicKey | default "" | quote }}
  ENETPULSE_API_KEY: {{ .Values.secrets.enetpulseApiKey | default "" | quote }}
  ODDSERVICE_API_KEY: {{ .Values.secrets.oddserviceApiKey | default "" | quote }}
