# ==============================================================================
# 1. Odds Engine Deployment
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odds-engine
  labels:
    app.kubernetes.io/name: odds-engine
    app.kubernetes.io/part-of: xbet-platform
spec:
  replicas: {{ .Values.oddsEngine.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: odds-engine
  template:
    metadata:
      labels:
        app: odds-engine
    spec:
      containers:
        - name: odds-engine
          image: "{{ .Values.image.registry }}/{{ .Values.oddsEngine.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.oddsEngine.port }}
              name: http-ws
          env:
            - name: PORT
              value: "{{ .Values.oddsEngine.port }}"
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
            - name: REDIS_HOST
              value: "{{ .Values.redis.host }}"
            - name: REDIS_PORT
              value: "{{ .Values.redis.port }}"
          resources:
            {{- toYaml .Values.oddsEngine.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.oddsEngine.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.oddsEngine.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
