apiVersion: v1
kind: Secret
metadata:
  name: xbet-production-secrets
  namespace: xbet-production
  labels:
    app.kubernetes.io/name: xbet-platform
    app.kubernetes.io/part-of: xbet
type: Opaque
stringData:
  # Database & Redis Credentials
  DATABASE_URL: "postgresql://postgres:REPLACE_WITH_SECURE_PASSWORD@postgres-service:5432/xbet_production?sslmode=require"
  REDIS_URL: "redis://:REPLACE_WITH_REDIS_PASSWORD@redis-service:6379"
  
  # Cryptographic Keys
  JWT_SECRET: "REPLACE_WITH_256_BIT_SECRET_KEY"
  JWT_REFRESH_SECRET: "REPLACE_WITH_256_BIT_REFRESH_SECRET_KEY"
  RNG_SERVER_MASTER_SEED: "REPLACE_WITH_SECURE_MASTER_RNG_SEED"
  
  # Payment Gateway Secrets
  STRIPE_SECRET_KEY: "sk_live_REPLACE_WITH_STRIPE_LIVE_KEY"
  STRIPE_WEBHOOK_SECRET: "whsec_REPLACE_WITH_STRIPE_WEBHOOK_SECRET"
  COINPAYMENTS_PRIVATE_KEY: "REPLACE_WITH_COINPAYMENTS_PRIVATE_KEY"
  COINPAYMENTS_IPN_SECRET: "REPLACE_WITH_COINPAYMENTS_IPN_SECRET"
  PAYPAL_CLIENT_SECRET: "REPLACE_WITH_PAYPAL_CLIENT_SECRET"
  SKRILL_SECRET_WORD: "REPLACE_WITH_SKRILL_SECRET_WORD"
  
  # Feed Provider Credentials (CakePHP Feeds Plugin)
  ENETPULSE_CLIENT_SECRET: "REPLACE_WITH_ENETPULSE_SECRET"
  ODDSERVICE_CLIENT_SECRET: "REPLACE_WITH_ODDSERVICE_SECRET"
