services:
  # ==========================================================================
  # Modern Stack - PostgreSQL 16
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xbet
      POSTGRES_USER: xbet
      POSTGRES_PASSWORD: xbet_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xbet"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ==========================================================================
  # Modern Stack - Microservices
  # ==========================================================================
  migrations:
    build:
      context: .
      dockerfile: services/betting-engine/Dockerfile
    working_dir: /app
    command: ["node", "--experimental-strip-types", "scripts/migrate-points.ts"]
    environment:
      DATABASE_URL: postgresql://xbet:xbet_dev@postgres:5432/xbet
    depends_on:
      postgres:
        condition: service_healthy

  odds-engine:
    build:
      context: .
      dockerfile: services/odds-engine/Dockerfile
    ports:
      - "4000:4000"
    environment:
      XBET_PILOT_MODE: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      RNG_SEED_KEY: ${RNG_SEED_KEY:?Set RNG_SEED_KEY}
      ENABLE_SIMULATOR: ${ENABLE_SIMULATOR:-false}
      PORT: "4000"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://xbet:xbet_dev@postgres:5432/xbet
    depends_on:
      migrations:
        condition: service_completed_successfully

  betting-engine:
    build:
      context: .
      dockerfile: services/betting-engine/Dockerfile
    ports:
      - "4001:4001"
    environment:
      XBET_PILOT_MODE: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      RNG_SEED_KEY: ${RNG_SEED_KEY:?Set RNG_SEED_KEY}
      PORT: "4001"
      HOST: "0.0.0.0"
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ODDS_ENGINE_URL: http://odds-engine:4000
      DATABASE_URL: postgresql://xbet:xbet_dev@postgres:5432/xbet
    depends_on:
      migrations:
        condition: service_completed_successfully

  casino-engine:
    build:
      context: .
      dockerfile: services/casino-engine/Dockerfile
    ports:
      - "4002:4002"
    environment:
      XBET_PILOT_MODE: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      RNG_SEED_KEY: ${RNG_SEED_KEY:?Set RNG_SEED_KEY}
      PORT: "4002"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://xbet:xbet_dev@postgres:5432/xbet
      BETTING_ENGINE_URL: http://betting-engine:4001
    depends_on:
      migrations:
        condition: service_completed_successfully
      betting-engine:
        condition: service_started

  legacy-bridge:
    build:
      context: .
      dockerfile: packages/legacy-bridge/Dockerfile
    ports:
      - "4003:4003"
    environment:
      XBET_PILOT_MODE: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      RNG_SEED_KEY: ${RNG_SEED_KEY:?Set RNG_SEED_KEY}
      PORT: "4003"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://xbet:xbet_dev@postgres:5432/xbet
    depends_on:
      migrations:
        condition: service_completed_successfully

  web-frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "4004:4004"
    environment:
      XBET_PILOT_MODE: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      RNG_SEED_KEY: ${RNG_SEED_KEY:?Set RNG_SEED_KEY}
      PORT: "4004"
      ODDS_ENGINE_URL: http://odds-engine:4000
      BETTING_ENGINE_URL: http://betting-engine:4001
      CASINO_ENGINE_URL: http://casino-engine:4002
      LEGACY_BRIDGE_URL: http://legacy-bridge:4003
    depends_on:
      - odds-engine
      - betting-engine
      - casino-engine
      - legacy-bridge

  # ==========================================================================
  # Unified API Gateway & Reverse Proxy
  # ==========================================================================
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - odds-engine
      - betting-engine
      - casino-engine
      - legacy-bridge
      - web-frontend

volumes:
  pgdata:
