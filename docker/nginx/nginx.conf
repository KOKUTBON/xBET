user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=10r/s;

    # Upstream Definitions
    upstream web_frontend_upstream {
        server web-frontend:3000;
        keepalive 32;
    }

    upstream odds_engine_upstream {
        server odds-engine:4000;
        keepalive 32;
    }

    upstream betting_engine_upstream {
        server betting-engine:4001;
        keepalive 32;
    }

    upstream casino_engine_upstream {
        server casino-engine:4002;
        keepalive 32;
    }

    upstream legacy_bridge_upstream {
        server legacy-bridge:4003;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost _;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # -------------------------------------------------------------
        # 1. Real-Time WebSocket Streaming Gateway
        # -------------------------------------------------------------
        location /ws {
            proxy_pass http://odds_engine_upstream/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # -------------------------------------------------------------
        # 2. Odds & Fixtures Service Routes
        # -------------------------------------------------------------
        location ~ ^/api/v1/(odds|fixtures) {
            limit_req zone=api_rate_limit burst=20 nodelay;
            proxy_pass http://odds_engine_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # 3. Betting, Wallet & Settlement Service Routes
        # -------------------------------------------------------------
        location ~ ^/api/v1/(betting|wallet|settlement) {
            limit_req zone=api_rate_limit burst=20 nodelay;
            proxy_pass http://betting_engine_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # 4. Casino RGS, Virtual Sports & Poker Service Routes
        # -------------------------------------------------------------
        location ~ ^/api/v1/(casino|virtual-sports|poker) {
            limit_req zone=api_rate_limit burst=20 nodelay;
            proxy_pass http://casino_engine_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # 5. Auth, Users, Payments, CMS, Admin & Legacy Bridge Routes
        # -------------------------------------------------------------
        location ~ ^/api/v1/auth {
            limit_req zone=auth_rate_limit burst=10 nodelay;
            proxy_pass http://legacy_bridge_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(api/v1/(users|admin|payments|bonuses|tickets|support|cms|i18n)|legacy) {
            limit_req zone=api_rate_limit burst=20 nodelay;
            proxy_pass http://legacy_bridge_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Global Service Health Check Aggregator
        location /gateway-health {
            default_type application/json;
            return 200 '{"status":"HEALTHY","gateway":"nginx","version":"1.25-alpine","timestamp":"$time_iso8601"}';
        }

        # -------------------------------------------------------------
        # 6. Single-Page Application (SPA) Web Frontend
        # -------------------------------------------------------------
        location / {
            proxy_pass http://web_frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
